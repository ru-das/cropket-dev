# vite-plugin-pwa's registerSW() imports "workbox-window" from a virtual
# module with no real file path, so pnpm's strict (non-hoisted) node_modules
# can't resolve it at build time. This is vite-plugin-pwa's own documented
# pnpm fix — pnpm 10+ moved hoist settings here from .npmrc.
publicHoistPattern:
  - "*workbox*"

minimumReleaseAgeExclude:
  - prettier@3.9.7
  - '@types/node@22.20.3'
  - '@tanstack/query-async-storage-persister@5.103.1'
  - '@tanstack/query-core@5.103.1'
  - '@tanstack/query-persist-client-core@5.103.1'
  - '@tanstack/react-query-persist-client@5.103.1'
  - '@tanstack/react-query@5.103.1'
