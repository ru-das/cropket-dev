<!-- Maskable variant of icon.svg: full bleed square (no rounded corners, the OS
     applies its own mask shape), same glyph, already inside the 80% safe zone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1F6B3A" />
  <g fill="#FFFFFF">
    <rect x="246" y="150" width="20" height="230" rx="10" />
    <ellipse cx="256" cy="140" rx="20" ry="34" />
    <g>
      <ellipse cx="222" cy="330" rx="20" ry="36" transform="rotate(-35 222 330)" />
      <ellipse cx="290" cy="330" rx="20" ry="36" transform="rotate(35 290 330)" />
    </g>
    <g>
      <ellipse cx="222" cy="280" rx="20" ry="36" transform="rotate(-35 222 280)" />
      <ellipse cx="290" cy="280" rx="20" ry="36" transform="rotate(35 290 280)" />
    </g>
    <g>
      <ellipse cx="222" cy="230" rx="20" ry="36" transform="rotate(-35 222 230)" />
      <ellipse cx="290" cy="230" rx="20" ry="36" transform="rotate(35 290 230)" />
    </g>
  </g>
</svg>
